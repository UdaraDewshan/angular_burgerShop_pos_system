<section class="py-16 bg-gray-50 min-h-screen">
  <div class="container mx-auto px-8 xl:px-12 max-w-[90rem]">
    <br>
    <br>
    
    <div class="text-center mb-12">
      <h2 class="text-3xl font-black text-gray-900 uppercase tracking-tighter">
        Our <span class="text-red-600">Best Sellers</span>
      </h2>
      <p class="text-gray-500 mt-2">Flame-grilled to perfection. Choose your favorite.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-3 gap-6 place-items-center">
      
      @for (item of products; track item.id){

        <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 group overflow-hidden border border-gray-100 relative w-full max-w-sm">
        
        <div class="h-40 bg-gray-100 flex items-center justify-center relative overflow-hidden">
             <img [src]="item.image" [alt]="item.name" class="w-2/3 transform group-hover:scale-110 transition duration-500 drop-shadow-md">
            
            <span class="absolute top-3 right-3 bg-yellow-500 text-black font-bold px-2 py-1 rounded-full text-xs shadow-sm">
              Rs.{{item.price}}
            </span>
        </div>

        <div class="p-4 text-center">
            <h3 class="text-base font-bold text-gray-900 group-hover:text-red-600 transition-colors">{{item.name}}</h3>
            <p class="text-xs text-gray-400 mt-1 line-clamp-2">{{item.description}}</p>
            
            <button (click)="addToCart(item)" class="mt-3 w-full py-2 text-sm bg-gray-900 text-white font-bold rounded-xl hover:bg-red-600 transition-colors shadow-md flex items-center justify-center gap-2">
                <span>Add to Order</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
      </div>
      }
      
    </div>
  </div>
</section>
