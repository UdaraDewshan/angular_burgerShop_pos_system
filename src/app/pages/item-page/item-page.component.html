<section class="py-16 bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4">
    
    <div class="text-center mb-12">
      <h2 class="text-3xl font-black text-gray-900 uppercase tracking-tighter">
        Our <span class="text-red-600">Best Sellers</span>
      </h2>
      <p class="text-gray-500 mt-2">Flame-grilled to perfection. Choose your favorite.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
      
      @for (item of products; track item.id){

        <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 group overflow-hidden border border-gray-100 relative">
        
        <div class="h-48 bg-gray-100 flex items-center justify-center relative overflow-hidden">
             <img [src]="item.image" [alt]="item.name" class="w-3/4 transform group-hover:scale-110 transition duration-500 drop-shadow-md">
            
            <span class="absolute top-3 right-3 bg-yellow-500 text-black font-bold px-3 py-1 rounded-full text-sm shadow-sm">
              Rs.{{item.price}}
            </span>
        </div>

        <div class="p-5 text-center">
            <h3 class="text-lg font-bold text-gray-900 group-hover:text-red-600 transition-colors">{{item.name}}</h3>
            <p class="text-sm text-gray-400 mt-1 line-clamp-2">{{item.description}}</p>
            
            <button (click)="addToCart(item)" class="mt-4 w-full py-2 bg-gray-900 text-white font-bold rounded-xl hover:bg-red-600 transition-colors shadow-md flex items-center justify-center gap-2">
                <span>Add to Order</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
      </div>
      }
      
    </div>
  </div>
</section>
